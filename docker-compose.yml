version: "3.4"

networks:
  app:
    driver: bridge

services:
  users_service:
    build:
      context: .
      dockerfile: ./build/Dockerfile_users_service
    restart: always
    container_name: 'users_service'
    ports:
      - 8081:8080
      - 8082:8082
    networks:
      - app
  friends_service:
    build:
      context: .
      dockerfile: ./build/Dockerfile_friends_service
    restart: always
    environment:
      - USERS_SERVICE=users_service
      - USER_SERVICE_GRPC_PORT=8082
    container_name: 'friends_service'
    ports:
      - 8085:8080
      - 8086:8082
    networks:
      - app
  chat_service:
    build:
      context: .
      dockerfile: ./build/Dockerfile_chat_service
    restart: always
    environment:
      - USERS_SERVICE=users_service
      - USER_SERVICE_GRPC_PORT=8082
      - FRIENDS_SERVICE=friends_service
      - FRIENDS_SERVICE_GRPC_PORT=8086
    container_name: 'chat_service'
    ports:
      - 8088:8080
      - 8089:8082
    networks:
      - app   

  # PostgreSQL database
  postgres:
    image: postgres:${POSTGRES_VERSION}
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: ${PGDATA}
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD}
    container_name: 'postgresql-orders-management-system'
    volumes:
      - ./configs/postgres/postgres.conf:/etc/postgresql/postgresql.conf # конфиг Postgres
      # - ./docker/postgresql/data:/var/lib/postgresql/data # persistent volume для того, чтобы при перезапуске контейнера все данные сохранялись
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    # Хелсчек для проверки готовности БД к работе
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - 6532:5432
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G  
    networks:
      - app   
  